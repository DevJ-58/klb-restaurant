<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const enabled = '%VITE_ENABLE_LIGHT_MODE%' === 'true';
          const key = 'klb-theme';
          const defaultTheme = '%VITE_DEFAULT_THEME%';
          const stored = localStorage.getItem(key);
          const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          const resolveTheme = () => {
            if (!enabled) {
              return 'dark';
            }
            if (stored === 'light' || stored === 'dark') {
              return stored;
            }
            if (defaultTheme === 'light' || defaultTheme === 'dark') {
              return defaultTheme;
            }
            if (defaultTheme === 'system') {
              return systemTheme;
            }
            return 'dark';
          };
          const theme = resolveTheme();
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]') || document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          meta.setAttribute('content', theme === 'light' ? '#fbf6ea' : '#0b0806');
          document.head.appendChild(meta);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0806" />
    <meta
      name="description"
      content="KLB Restaurant et cafétéria à Morofé, Yamoussoukro. Bonne cuisine, bonne ambiance !"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KLB Restaurant — Bonne cuisine, bonne ambiance" />
    <meta
      property="og:description"
      content="Restaurant et cafétéria à Morofé, Yamoussoukro."
    />
    <meta property="og:locale" content="fr_CI" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-partage.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      as="image"
      href="/images/hero/hero-plat-signature.jpg"
      fetchpriority="high"
    />
    <title>KLB Restaurant — Bonne cuisine, bonne ambiance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
